version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [maintenance]
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    labels: [maintenance]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]
