name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # lint / typecheck / unit-test matrix / conformance — see checks.yml.
  # Integration tests are intentionally NOT run in CI: they need a live MACP
  # runtime and stay a local gate (make test-integration; they auto-skip
  # when no runtime is reachable).
  checks:
    uses: ./.github/workflows/checks.yml

  # This job's build + twine check steps are mirrored by the `build` Makefile
  # target — keep the two in sync (see issue #39).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [checks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
