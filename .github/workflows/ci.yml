name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # lint / typecheck / unit-test matrix / conformance — see checks.yml.
  # Integration tests are intentionally NOT run in CI: they need a live MACP
  # runtime and stay a local gate (make test-integration; they auto-skip
  # when no runtime is reachable).
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [checks]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
