name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # lint / typecheck / unit-test matrix / conformance — see checks.yml.
  # Integration tests are intentionally NOT run in CI: they need a live MACP
  # runtime and stay a local gate (make test-integration; they auto-skip
  # when no runtime is reachable).
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [checks]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
