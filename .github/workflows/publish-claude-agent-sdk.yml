name: Publish claude-agent-sdk-macp to PyPI

# Releases of integrations/claude-agent-sdk are tagged claude-agent-sdk-macp-vX.Y.Z by
# release-please. publish.yml only publishes v* tags, so the two never overlap.
on:
  push:
    tags:
      - "claude-agent-sdk-macp-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only; skip the upload"
        required: false
        default: "false"

defaults:
  run:
    working-directory: integrations/claude-agent-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "../..[receipts]" -e ".[dev]"
      - run: ruff check src tests examples && ruff format --check src tests examples && mypy
      - run: pytest tests/unit --cov
      - name: Guard tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/claude-agent-sdk-macp-v')
        run: |
          tag_version="${GITHUB_REF_NAME#claude-agent-sdk-macp-v}"
          pkg_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $tag_version does not match pyproject version $pkg_version" >&2
            exit 1
          fi
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: integrations/claude-agent-sdk/dist/

  # PyPI trusted publishing (OIDC): the claude-agent-sdk-macp publisher on PyPI pins
  # this repo, this workflow filename and the `pypi` environment.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    if: ${{ startsWith(github.ref, 'refs/tags/claude-agent-sdk-macp-v') && github.event.inputs.dry_run != 'true' }}
    environment:
      name: pypi
      url: https://pypi.org/project/claude-agent-sdk-macp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true
