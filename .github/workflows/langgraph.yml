name: langgraph-macp

# CI for the integrations/langgraph package. It is a separate package
# (own version, own release tag), so it gets its own workflow. The job names
# do not collide with ci.yml's required checks. The SDK is installed from this
# checkout, so an SDK change that breaks the adapter fails here.
on:
  push:
    branches: [main]
    paths:
      - "integrations/langgraph/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/langgraph.yml"
  pull_request:
    branches: [main]
    paths:
      - "integrations/langgraph/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/langgraph.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: integrations/langgraph

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "../..[receipts]" -e ".[dev]"
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: mypy
      - run: mypy examples

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e "../..[receipts]" -e ".[dev]"
      - run: pytest tests/unit -v --cov

  # Same pinned runtime as ci.yml's integration job; bump them together.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    services:
      runtime:
        image: ghcr.io/multiagentcoordinationprotocol/macp-runtime:0.9.0
        env:
          MACP_ALLOW_INSECURE: "1"
          MACP_MEMORY_ONLY: "1"
          MACP_BIND_ADDR: "0.0.0.0:50051"
        ports: ["50051:50051"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "../..[receipts]" -e ".[dev]"
      # conftest.py skips the directory when no runtime answers, so wait for
      # it here and fail loudly instead of passing having tested nothing.
      - name: Wait for runtime
        run: |
          for i in $(seq 1 30); do nc -z localhost 50051 && exit 0; sleep 1; done
          echo "::error::runtime never became ready"; exit 1
      - name: Integration tests
        env:
          MACP_RUNTIME_TARGET: 127.0.0.1:50051
        run: |
          set -o pipefail
          pytest tests/integration -m integration --no-cov -v -rs | tee integration.log
      - name: Assert the suite ran
        run: |
          summary=$(tail -n 1 integration.log)
          echo "$summary"
          echo "$summary" | grep -qE '[1-9][0-9]* passed' || { echo "::error::no tests passed"; exit 1; }
          if echo "$summary" | grep -q skipped; then echo "::error::tests skipped"; exit 1; fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
