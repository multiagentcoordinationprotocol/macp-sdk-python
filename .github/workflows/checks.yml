# Reusable quality gate shared by ci.yml (push/PR) and publish.yml (release).
# Keeping lint/typecheck/test/conformance in one place prevents the two
# callers from drifting apart. The coverage gate (fail_under, branch) lives in
# pyproject.toml [tool.coverage.*] — the bare --cov below inherits it.
#
# Note: callers of a reusable workflow cannot set timeout-minutes, so the
# timeouts live on the jobs here.
#
# The lint/typecheck/test/conformance steps below are mirrored by the
# `lint`/`typecheck`/`test`/`test-conformance` Makefile targets — if you add,
# remove, or change a step here, update the matching Makefile target too, or
# `make test-all` silently stops reproducing CI (see issue #39).
name: Checks

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/ examples/
      - run: ruff format --check src/ tests/ examples/

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy src/macp_sdk/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit/ -v --cov

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # Replays the vendored fixtures through the SDK projections — no
      # runtime needed. Fixture *drift* vs the spec repo is gated separately
      # by conformance-fixtures.yml.
      - run: pytest tests/conformance/ -v -m conformance
