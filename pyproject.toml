[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macp-sdk-python"
version = "0.6.0"
description = "Python SDK for the MACP Rust runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Multi-Agent Coordination Protocol", email = "macp@multiagentcoordinationprotocol.org"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  # macp-proto 0.1.6's gencode was produced by protobuf 7.35.0 / grpc 1.82.0.
  # protobuf enforces this at import time: importing macp.v1.core_pb2 under an
  # older protobuf raises google.protobuf.runtime_version.VersionError
  # ("runtime version cannot be older than the linked gencode version"), so
  # these floors are hard requirements derived from the gencode, not from
  # macp-proto's own (looser) METADATA. This is the consumer-visible bump in
  # SDK 0.5.0 — deployments pinned to protobuf 6.x / grpcio < 1.82 cannot
  # straddle it.
  # grpcio 1.82.0 (stable) was YANKED from PyPI with no newer stable published
  # yet, which made a ">=1.82.0" floor unsatisfiable in fresh environments
  # (pip skips yanked versions when resolving ranges). The rc2 floor keeps the
  # gencode's GRPC_GENERATED_VERSION=1.82.0 import check satisfied (verified:
  # macp.v1.*_pb2_grpc imports cleanly under 1.82.0rc2) and, per PEP 440,
  # a pre-release in the specifier lets pip resolve it; pip will prefer the
  # next stable >= 1.82.1 as soon as one exists. Revisit then.
  "grpcio>=1.82.0rc2",
  "protobuf>=7.35.0",
  # Requires 0.1.6+ for the runtime v0.5.0 wire surface referenced by the SDK:
  # SessionStartPayload.max_suspend_ms (0.1.5), HandoffAcceptPayload.implicit
  # and ListSessionsRequest.page_size/page_token (0.1.6), and the canonical
  # macp.modes.multi_round.v1.ContributePayload proto encoding (0.1.4).
  # Retains the 0.1.3 surface (suspend/cancel/supersede, subscribe_session_id/
  # after_sequence, context_id/extensions). See docs/contributing.md
  # "Bumping macp-proto".
  # Capped below 0.1.8: that release's METADATA floor is "grpcio>=1.82.0",
  # which is unsatisfiable while grpcio 1.82.0 stable is yanked (see the
  # grpcio comment above) — PEP 440 sorts 1.82.0rc2 below 1.82.0, so no
  # candidate exists. 0.1.6/0.1.7 declare "grpcio>=1.74.0" and resolve fine.
  # Re-widen to <0.2.0 once grpcio publishes a stable >= 1.82.1.
  "macp-proto>=0.1.6,<0.1.9",
]

[project.urls]
Homepage = "https://github.com/multiagentcoordinationprotocol/macp-sdk-python"
Repository = "https://github.com/multiagentcoordinationprotocol/macp-sdk-python"
Documentation = "https://github.com/multiagentcoordinationprotocol/macp-sdk-python/tree/main/docs"
Changelog = "https://github.com/multiagentcoordinationprotocol/macp-sdk-python/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/multiagentcoordinationprotocol/macp-sdk-python/issues"

[project.optional-dependencies]
# grpcio-tools was dropped from dev: this repo has no proto-generation step
# (bindings come from the macp-proto package; generation lives in the spec
# repo), and every installable grpcio-tools stable caps protobuf<7.0.0,
# which conflicts with the protobuf>=7.35.0 floor above.
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.5",
  "grpc-stubs>=1.53",
  "build>=1.0",
  "jsonschema>=4.0",  # validate vendored conformance fixtures against schema.json
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["macp_sdk*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = []

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ARG", "RET", "N", "RUF"]
# N806: allow lowercase-only asserts (pytest idiom); tests fake-proto fixtures
# sometimes bind PascalCase temporaries that mirror proto class names.
# N802: tests use snake_case method names in some mocked proto calls.
extend-ignore = []

[tool.ruff.lint.per-file-ignores]
# Test files get some latitude:
#   ARG001/002/005 — pytest fixtures and mock-lambda signatures intentionally
#                    carry unused parameters to match the production callable.
#   N802/806      — mocked proto classes and fixtures use PascalCase locals.
"tests/**/*.py" = ["ARG001", "ARG002", "ARG005", "N802", "N806"]

[tool.mypy]
packages = ["macp_sdk"]
mypy_path = "src"
exclude = []
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
# Protobuf generated modules lack type stubs — treat all their types as Any
follow_imports = "normal"

[[tool.mypy.overrides]]
module = "macp.*"
ignore_missing_imports = true
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "macp.v1.*"
ignore_missing_imports = true
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "macp.modes.*"
ignore_missing_imports = true
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "grpc.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "integration: requires running MACP runtime",
  "conformance: replays conformance fixtures against runtime",
]
filterwarnings = [
  "error",
  # Unit tests build real MacpClient objects against localhost:0 with mocked
  # stubs and rely on GC to reap the never-connected socket; the resulting
  # "unclosed socket" ResourceWarning fires inside socket.__del__ and would
  # otherwise escalate to PytestUnraisableExceptionWarning under -W error.
  "ignore::ResourceWarning",
]

# Coverage gate: single source of truth for `make test`, `make coverage`, and
# CI (all invoke pytest with a bare --cov and inherit source/branch/fail_under
# from here).
[tool.coverage.run]
source = ["macp_sdk"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
